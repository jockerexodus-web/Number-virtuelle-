<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toby SMS by Waze Studio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📱</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f4f6f9;--card:#fff;--text:#2c3e50;--muted:#7f8c8d;--border:#e1e6eb;--primary:#3498db;--primary-dark:#2980b9;--success:#2ecc71;--danger:#e74c3c}
body.dark{--bg:#0f1720;--card:#1a2530;--text:#e8edf2;--muted:#8b97a3;--border:#2a3643}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;transition:background .3s,color .3s}
.container{max-width:1200px;margin:0 auto;padding:0 20px}
header{background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.header-inner{display:flex;justify-content:space-between;align-items:center;height:68px;gap:16px;flex-wrap:wrap}
.logo{font-size:20px;font-weight:700;color:var(--text);text-decoration:none;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo .brand{color:var(--primary)}
.logo .studio{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.5px;display:block;margin-top:-4px}
nav{display:flex;gap:4px}
nav a{color:var(--muted);text-decoration:none;padding:8px 14px;border-radius:8px;font-weight:500;font-size:14px;transition:all .2s}
nav a:hover{background:var(--bg);color:var(--text)}
nav a.active{background:rgba(52,152,219,.12);color:var(--primary)}
.icon-btn{background:transparent;border:1px solid var(--border);color:var(--text);width:40px;height:40px;border-radius:10px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.icon-btn:hover{background:var(--bg);border-color:var(--primary);color:var(--primary)}
.hero{text-align:center;padding:40px 0 20px}
.hero h1{font-size:34px;margin-bottom:10px;background:linear-gradient(135deg,var(--primary),var(--success));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{color:var(--muted);font-size:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:30px 0 20px}
.stat-card{background:var(--card);border-radius:12px;padding:18px 20px;border:1px solid var(--border);display:flex;align-items:center;gap:14px}
.stat-icon{font-size:26px;width:48px;height:48px;background:rgba(52,152,219,.12);border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat-value{font-size:24px;font-weight:700;line-height:1.2}
.stat-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.toolbar{background:var(--card);border-radius:12px;padding:16px 20px;border:1px solid var(--border);display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.search-box{flex:1;min-width:200px;position:relative}
.search-box input{width:100%;padding:11px 14px 11px 40px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-size:14px;font-family:inherit}
.search-box::before{content:'🔍';position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.6}
.search-box input:focus{outline:none;border-color:var(--primary);background:var(--card)}
.filter-select{padding:11px 14px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;cursor:pointer;min-width:150px}
.filter-select:focus{outline:none;border-color:var(--primary)}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.section-header h2{font-size:20px}
.result-count{color:var(--muted);font-size:14px}
.numeros-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:50px}
.numero-card{background:var(--card);border-radius:12px;padding:20px;text-decoration:none;color:inherit;border:1px solid var(--border);transition:all .2s;position:relative;overflow:hidden}
.numero-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--primary),var(--success));transform:scaleX(0);transform-origin:left;transition:transform .3s}
.numero-card:hover::before{transform:scaleX(1)}
.numero-card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.1);border-color:var(--primary)}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.flag{font-size:24px;line-height:1}
.favorite{background:none;border:none;cursor:pointer;font-size:18px;opacity:.35;transition:opacity .2s,transform .2s;padding:4px}
.favorite:hover{opacity:.8;transform:scale(1.15)}
.favorite.active{opacity:1}
.numero-card .numero{font-size:20px;font-weight:700;color:var(--text);margin-bottom:10px;font-family:'Courier New',monospace;letter-spacing:-.5px}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;gap:8px;flex-wrap:wrap}
.badge{background:rgba(52,152,219,.12);color:var(--primary);padding:4px 10px;border-radius:20px;font-weight:600;font-size:12px}
.sms-count{color:var(--muted);font-size:12px}
.empty{text-align:center;padding:60px 40px;color:var(--muted);background:var(--card);border-radius:12px;border:1px dashed var(--border);grid-column:1/-1}
.empty-icon{font-size:48px;margin-bottom:14px;opacity:.7}
.empty p{font-size:16px;margin-bottom:6px;color:var(--text)}
.empty small{font-size:13px}
.loader{text-align:center;padding:60px 40px;grid-column:1/-1}
.loader-spin{width:44px;height:44px;border:4px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
footer{text-align:center;padding:30px 0;color:var(--muted);font-size:14px;border-top:1px solid var(--border);background:var(--card);margin-top:50px}
footer strong{color:var(--primary)}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:#1a252f;color:#fff;padding:12px 22px;border-radius:10px;font-weight:600;opacity:0;transition:all .3s;pointer-events:none;z-index:999;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:640px){
.hero h1{font-size:24px}
.header-inner{height:auto;padding:12px 0;flex-direction:column;align-items:stretch}
nav{justify-content:center}
.logo{justify-content:center;text-align:center}
.toolbar{padding:12px}
.filter-select{min-width:0;flex:1}
}
</style>
</head>
<body>
<header>
<div class="container header-inner">
<a href="index.html" class="logo"><span>📱 <span class="brand">Toby SMS</span><span class="studio">by Waze Studio</span></span></a>
<nav>
<a href="index.html" class="active">Numéros</a>
<a href="admin.html">⚙️ Admin</a>
</nav>
<button class="icon-btn" id="theme-toggle">🌙</button>
</div>
</header>

<main class="container">
<section class="hero">
<h1>Recevez de vrais SMS en ligne</h1>
<p>Numéros virtuels · Réception en temps réel · 100% gratuit</p>
</section>

<section class="stats">
<div class="stat-card"><div class="stat-icon">📞</div><div><div class="stat-value" id="stat-numeros">0</div><div class="stat-label">Numéros actifs</div></div></div>
<div class="stat-card"><div class="stat-icon">💬</div><div><div class="stat-value" id="stat-sms">0</div><div class="stat-label">SMS reçus</div></div></div>
<div class="stat-card"><div class="stat-icon">🌍</div><div><div class="stat-value" id="stat-pays">0</div><div class="stat-label">Pays couverts</div></div></div>
<div class="stat-card"><div class="stat-icon">⚡</div><div><div class="stat-value">1<span style="font-size:14px">s</span></div><div class="stat-label">Temps réel</div></div></div>
</section>

<div class="toolbar">
<div class="search-box"><input type="text" id="search" placeholder="Rechercher un numéro, un pays..."></div>
<select id="filter-pays" class="filter-select"><option value="">🌍 Tous les pays</option></select>
<select id="filter-tri" class="filter-select">
<option value="recent">🕐 Plus récents</option>
<option value="sms">💬 Plus de SMS</option>
<option value="numero">🔢 Numéro (A→Z)</option>
<option value="pays">🌍 Pays (A→Z)</option>
</select>
</div>

<div class="section-header">
<h2>Numéros disponibles</h2>
<span class="result-count" id="result-count"></span>
</div>

<div id="numeros-grid" class="numeros-grid">
<div class="loader"><div class="loader-spin"></div><p>Connexion à la base de données...</p></div>
</div>
</main>

<footer>
<div class="container">
<p>&copy; <span id="year"></span> <strong>Toby SMS</strong> by Waze Studio</p>
</div>
</footer>

<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyC7DyasG34K8ylgxbHVzxgAxIGACUFVbLA",
  authDomain: "toby-9065b.firebaseapp.com",
  databaseURL: "https://toby-9065b-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "toby-9065b",
  storageBucket: "toby-9065b.firebasestorage.app",
  messagingSenderId: "163849144101",
  appId: "1:163849144101:web:3db472e7f6f237afafbccc"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const FLAGS = {'france':'🇫🇷','usa':'🇺🇸','états-unis':'🇺🇸','united states':'🇺🇸','royaume-uni':'🇬🇧','uk':'🇬🇧','angleterre':'🇬🇧','allemagne':'🇩🇪','germany':'🇩🇪','espagne':'🇪🇸','italie':'🇮🇹','belgique':'🇧🇪','canada':'🇨🇦','suisse':'🇨🇭','portugal':'🇵🇹','pays-bas':'🇳🇱','suède':'🇸🇪','norvège':'🇳🇴','danemark':'🇩🇰','finlande':'🇫🇮','irlande':'🇮🇪','autriche':'🇦🇹','pologne':'🇵🇱','inde':'🇮🇳','chine':'🇨🇳','japon':'🇯🇵','brésil':'🇧🇷','mexique':'🇲🇽','australie':'🇦🇺','maroc':'🇲🇦','algérie':'🇩🇿','tunisie':'🇹🇳','égypte':'🇪🇬','sénégal':'🇸🇳','cameroun':'🇨🇲'};
const getFlag = p => FLAGS[(p||'').toLowerCase().trim()] || '🌐';
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const grid = document.getElementById('numeros-grid');
const searchInput = document.getElementById('search');
const filterPays = document.getElementById('filter-pays');
const filterTri = document.getElementById('filter-tri');
const resultCount = document.getElementById('result-count');

let allNumeros = [];
let favorites = JSON.parse(localStorage.getItem('toby_favs') || '[]');
let demoInjected = false;

onValue(ref(db, 'numeros'), async (snapshot) => {
  const data = snapshot.val() || {};
  allNumeros = Object.entries(data).map(([id, n]) => ({ id, ...n }));

  if (allNumeros.length === 0 && !demoInjected) {
    demoInjected = true;
    await injectDemo();
    return;
  }

  const paysUniques = [...new Set(allNumeros.map(n => n.pays).filter(Boolean))].sort();
  filterPays.innerHTML = '<option value="">🌍 Tous les pays</option>' + paysUniques.map(p => `<option value="${esc(p)}">${getFlag(p)} ${esc(p)}</option>`).join('');

  const totalSms = allNumeros.reduce((s, n) => s + (n.nb_sms || 0), 0);
  document.getElementById('stat-numeros').textContent = allNumeros.length;
  document.getElementById('stat-sms').textContent = totalSms;
  document.getElementById('stat-pays').textContent = paysUniques.length;

  renderNumeros();
}, (error) => {
  grid.innerHTML = `<div class="empty"><div class="empty-icon">❌</div><p>Erreur de connexion</p><small>${esc(error.message)}</small></div>`;
});

function renderNumeros() {
  let result = [...allNumeros];
  const q = searchInput.value.toLowerCase().trim();
  if (q) result = result.filter(n => (n.numero||'').toLowerCase().includes(q) || (n.pays||'').toLowerCase().includes(q) || (n.operateur||'').toLowerCase().includes(q));
  if (filterPays.value) result = result.filter(n => n.pays === filterPays.value);
  const tri = filterTri.value;
  if (tri === 'recent') result.sort((a,b)=>(b.created_at||0)-(a.created_at||0));
  else if (tri === 'sms') result.sort((a,b)=>(b.nb_sms||0)-(a.nb_sms||0));
  else if (tri === 'numero') result.sort((a,b)=>(a.numero||'').localeCompare(b.numero||''));
  else if (tri === 'pays') result.sort((a,b)=>(a.pays||'').localeCompare(b.pays||''));
  result.sort((a,b)=>((favorites.includes(b.id)?1:0)-(favorites.includes(a.id)?1:0)));

  resultCount.textContent = `${result.length} numéro${result.length>1?'s':''}`;

  if (!result.length) {
    grid.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><p>Aucun résultat</p><small>Essaie d'autres mots-clés</small></div>`;
    return;
  }

  grid.innerHTML = result.map(n => {
    const fav = favorites.includes(n.id);
    return `<a href="sms.html?id=${n.id}" class="numero-card">
      <div class="card-top"><span class="flag">${getFlag(n.pays)}</span>
      <button class="favorite ${fav?'active':''}" data-fav="${n.id}" title="Favori">${fav?'⭐':'☆'}</button></div>
      <div class="numero">${esc(n.numero||'')}</div>
      <div class="meta">
        <span class="badge">${esc(n.pays||'—')}</span>
        <span class="sms-count">💬 ${n.nb_sms||0} SMS</span>
      </div>
    </a>`;
  }).join('');

  document.querySelectorAll('[data-fav]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      const id = btn.dataset.fav;
      if (favorites.includes(id)) favorites = favorites.filter(f=>f!==id);
      else favorites.push(id);
      localStorage.setItem('toby_favs', JSON.stringify(favorites));
      renderNumeros();
    });
  });
}

async function injectDemo() {
  grid.innerHTML = `<div class="loader"><div class="loader-spin"></div><p>Création des numéros de démo...</p></div>`;
  const demo = [
    { numero:'+33 6 12 34 56 78', pays:'France', operateur:'Orange', nb_sms:2 },
    { numero:'+33 6 98 76 54 32', pays:'France', operateur:'SFR', nb_sms:0 },
    { numero:'+33 7 45 67 89 01', pays:'France', operateur:'Bouygues', nb_sms:1 },
    { numero:'+1 415 555 2671', pays:'USA', operateur:'T-Mobile', nb_sms:0 },
    { numero:'+1 212 555 0147', pays:'USA', operateur:'AT&T', nb_sms:0 },
    { numero:'+44 7700 900 123', pays:'Royaume-Uni', operateur:'Vodafone', nb_sms:1 },
    { numero:'+49 151 2345 6789', pays:'Allemagne', operateur:'Telekom', nb_sms:0 },
    { numero:'+34 612 345 678', pays:'Espagne', operateur:'Movistar', nb_sms:0 },
    { numero:'+32 470 12 34 56', pays:'Belgique', operateur:'Proximus', nb_sms:0 },
    { numero:'+41 76 123 45 67', pays:'Suisse', operateur:'Swisscom', nb_sms:0 },
    { numero:'+1 604 555 0199', pays:'Canada', operateur:'Rogers', nb_sms:0 },
    { numero:'+39 333 123 4567', pays:'Italie', operateur:'TIM', nb_sms:0 },
    { numero:'+351 912 345 678', pays:'Portugal', operateur:'MEO', nb_sms:0 },
    { numero:'+212 6 12 34 56 78', pays:'Maroc', operateur:'Maroc Telecom', nb_sms:0 },
    { numero:'+213 5 12 34 56 78', pays:'Algérie', operateur:'Djezzy', nb_sms:0 },
    { numero:'+216 20 123 456', pays:'Tunisie', operateur:'Ooredoo', nb_sms:0 }
  ];
  const now = Date.now();
  for (let i = 0; i < demo.length; i++) {
    await set(ref(db, 'numeros/demo_' + i), { ...demo[i], created_at: now - i * 1000 });
  }

  const demoMsgs = [
    { numero:'demo_0', expediteur:'Google', contenu:'Votre code de vérification est : 482910' },
    { numero:'demo_0', expediteur:'Facebook', contenu:'Code de connexion : 774512. Ne le partagez pas.' },
    { numero:'demo_2', expediteur:'WhatsApp', contenu:'Votre code WhatsApp est 123-456' },
    { numero:'demo_5', expediteur:'Amazon', contenu:'Votre OTP est 928471. Valide 10 minutes.' }
  ];
  for (let i = 0; i < demoMsgs.length; i++) {
    await set(ref(db, `messages/${demoMsgs[i].numero}/demo_msg_${i}`), {
      expediteur: demoMsgs[i].expediteur,
      contenu: demoMsgs[i].contenu,
      recu_at: now - i * 60000
    });
  }

  showToast('✅ 16 numéros et 4 SMS de démo créés !');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

searchInput.addEventListener('input', renderNumeros);
filterPays.addEventListener('change', renderNumeros);
filterTri.addEventListener('change', renderNumeros);

const themeToggle = document.getElementById('theme-toggle');
const savedTheme = localStorage.getItem('toby_theme') || 'light';
document.body.classList.toggle('dark', savedTheme === 'dark');
themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';
themeToggle.addEventListener('click', () => {
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  themeToggle.textContent = isDark ? '☀️' : '🌙';
  localStorage.setItem('toby_theme', isDark ? 'dark' : 'light');
});
document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
