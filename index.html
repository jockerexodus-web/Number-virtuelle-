<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iVASMS Clone — Numéros virtuels</title>
    <script type="module">
        // ─── Import Firebase (CDN, aucune install) ───
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        // ⚠️ REMPLACE par TA config Firebase (voir guide plus bas)
        const firebaseConfig = {
            apiKey: "AIzaSyXXXXXXXXXXXXXXXXXXXXXXX",
            authDomain: "ivasms-clone.firebaseapp.com",
            databaseURL: "https://ivasms-clone-default-rtdb.firebaseio.com",
            projectId: "ivasms-clone",
            storageBucket: "ivasms-clone.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef123456"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // ─── Affichage des numéros en temps réel ───
        const grid = document.getElementById('numeros-grid');
        const numerosRef = ref(db, 'numeros');

        onValue(numerosRef, (snapshot) => {
            const data = snapshot.val() || {};
            const entries = Object.entries(data);

            if (entries.length === 0) {
                grid.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">📭</div>
                        <p>Aucun numéro pour le moment</p>
                        <small>Va sur admin.html pour en ajouter</small>
                    </div>`;
                return;
            }

            grid.innerHTML = entries.map(([id, n]) => `
                <a href="sms.html?id=${id}" class="numero-card">
                    <div class="pays">${escapeHtml(n.pays || '—')}</div>
                    <div class="numero">${escapeHtml(n.numero || '')}</div>
                    <div class="meta">
                        <span class="badge">${escapeHtml(n.operateur || 'Twilio')}</span>
                        <span class="sms-count">${n.nb_sms || 0} SMS</span>
                    </div>
                </a>
            `).join('');
        });

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
            }[c]));
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f4f6f9;
            color: #2c3e50;
            line-height: 1.6;
            min-height: 100vh;
        }
        header {
            background: #fff;
            border-bottom: 1px solid #e1e6eb;
            position: sticky; top: 0; z-index: 100;
        }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
        .header-inner {
            display: flex; justify-content: space-between; align-items: center;
            height: 64px;
        }
        .logo { font-size: 22px; font-weight: 700; color: #2c3e50; text-decoration: none; }
        .logo span { color: #3498db; }
        nav a {
            color: #555; text-decoration: none; margin-left: 24px;
            font-weight: 500; transition: color .2s;
        }
        nav a:hover, nav a.active { color: #3498db; }
        .hero { text-align: center; padding: 50px 0 30px; }
        .hero h1 { font-size: 32px; margin-bottom: 12px; color: #1a252f; }
        .hero p { color: #7f8c8d; font-size: 16px; }
        h2 { margin-bottom: 20px; font-size: 20px; }
        .numeros-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px; margin-bottom: 50px;
        }
        .numero-card {
            background: #fff; border-radius: 10px; padding: 20px;
            text-decoration: none; color: inherit;
            border: 1px solid #e1e6eb; transition: all .2s;
            position: relative; overflow: hidden;
        }
        .numero-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,.08);
            border-color: #3498db;
        }
        .numero-card .pays { font-size: 13px; color: #7f8c8d; margin-bottom: 6px; }
        .numero-card .numero {
            font-size: 19px; font-weight: 700; color: #2c3e50;
            margin-bottom: 12px; font-family: 'Courier New', monospace;
        }
        .numero-card .meta {
            display: flex; justify-content: space-between;
            align-items: center; font-size: 13px;
        }
        .badge {
            background: #eaf4fc; color: #2980b9;
            padding: 3px 10px; border-radius: 20px; font-weight: 600;
        }
        .sms-count { color: #95a5a6; }
        .empty {
            text-align: center; padding: 60px 40px; color: #95a5a6;
            background: #fff; border-radius: 10px;
            border: 1px dashed #d5dbe0; grid-column: 1 / -1;
        }
        .empty-icon { font-size: 42px; margin-bottom: 12px; }
        footer {
            text-align: center; padding: 30px 0; color: #95a5a6;
            font-size: 14px; border-top: 1px solid #e1e6eb;
            background: #fff;
        }
        @media (max-width: 600px) {
            .hero h1 { font-size: 24px; }
            nav a { margin-left: 12px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-inner">
            <a href="index.html" class="logo">📱 iVASMS<span>Clone</span></a>
            <nav>
                <a href="index.html" class="active">Numéros</a>
                <a href="admin.html">⚙️ Admin</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h1>Recevez de vrais SMS en ligne</h1>
            <p>Numéros connectés à Twilio — réception en temps réel.</p>
        </section>

        <h2>Numéros disponibles</h2>
        <div id="numeros-grid" class="numeros-grid">
            <div class="empty">⏳ Chargement...</div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; <span id="year"></span> iVASMS Clone — Powered by Firebase</p>
        </div>
    </footer>
    <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
