<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — iVASMS Clone</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, push, set, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyXXXXXXXXXXXXXXXXXXXXXXX",
            authDomain: "ivasms-clone.firebaseapp.com",
            databaseURL: "https://ivasms-clone-default-rtdb.firebaseio.com",
            projectId: "ivasms-clone",
            storageBucket: "ivasms-clone.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef123456"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const PASSWORD = 'admin123'; // ⚠️ à changer
        let authed = false;

        // ─── Auth simple côté client (⚠️ pas sécurisé, démo seulement) ───
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const pwd = document.getElementById('pwd').value;
            if (pwd === PASSWORD) {
                authed = true;
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('admin-section').style.display = 'block';
                initAdmin();
            } else {
                document.getElementById('login-error').textContent = '❌ Mot de passe incorrect';
            }
        });

        // ─── Ajout d'un numéro ───
        document.getElementById('add-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const numero = document.getElementById('input-numero').value.trim();
            const pays = document.getElementById('input-pays').value.trim();
            const operateur = document.getElementById('input-operateur').value.trim() || 'Twilio';

            if (!numero || !pays) return;

            try {
                const newRef = push(ref(db, 'numeros'));
                await set(newRef, {
                    numero,
                    pays,
                    operateur,
                    nb_sms: 0,
                    created_at: Date.now()
                });
                e.target.reset();
                showToast('✅ Numéro ajouté');
            } catch (err) {
                showToast('❌ Erreur : ' + err.message);
            }
        });

        // ─── Liste des numéros ───
        function initAdmin() {
            const list = document.getElementById('admin-list');
            onValue(ref(db, 'numeros'), (snap) => {
                const data = snap.val() || {};
                const entries = Object.entries(data);

                if (entries.length === 0) {
                    list.innerHTML = '<div class="empty">Aucun numéro</div>';
                    return;
                }

                list.innerHTML = entries.map(([id, n]) => `
                    <div class="admin-item">
                        <div>
                            <strong>${escapeHtml(n.numero)}</strong>
                            <span class="pays"> — ${escapeHtml(n.pays)}</span>
                        </div>
                        <div class="admin-actions">
                            <button class="btn btn-small btn-primary" data-simulate="${id}" data-numero="${escapeHtml(n.numero)}">
                                📨 Simuler SMS
                            </button>
                            <button class="btn btn-small btn-danger" data-delete="${id}">🗑</button>
                        </div>
                    </div>
                `).join('');

                // Bind boutons
                list.querySelectorAll('[data-delete]').forEach(b => {
                    b.addEventListener('click', async () => {
                        if (!confirm('Supprimer ce numéro et ses messages ?')) return;
                        await remove(ref(db, `numeros/${b.dataset.delete}`));
                        await remove(ref(db, `messages/${b.dataset.delete}`));
                        showToast('✅ Supprimé');
                    });
                });

                list.querySelectorAll('[data-simulate]').forEach(b => {
                    b.addEventListener('click', () => simulateSMS(b.dataset.simulate, b.dataset.numero));
                });
            });
        }

        // ─── Simulation d'un SMS entrant ───
        async function simulateSMS(numeroId, numero) {
            const expediteur = prompt('Expéditeur ?', 'Google');
            if (!expediteur) return;
            const contenu = prompt('Contenu du SMS ?', 'Votre code de vérification est : 123456');
            if (!contenu) return;

            const msgRef = push(ref(db, `messages/${numeroId}`));
            await set(msgRef, {
                expediteur,
                contenu,
                recu_at: Date.now()
            });

            // Incrémente le compteur
            const countRef = ref(db, `numeros/${numeroId}/nb_sms`);
            const snap = await new Promise(res => onValue(countRef, res, { onlyOnce: true }));
            await set(countRef, (snap.val() || 0) + 1);

            showToast('📨 SMS simulé envoyé !');
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
            }[c]));
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f4f6f9; color: #2c3e50; line-height: 1.6; min-height: 100vh;
        }
        header {
            background: #fff; border-bottom: 1px solid #e1e6eb;
            position: sticky; top: 0; z-index: 100;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 0 20px; }
        .header-inner {
            display: flex; justify-content: space-between;
            align-items: center; height: 64px;
        }
        .logo { font-size: 22px; font-weight: 700; color: #2c3e50; text-decoration: none; }
        .logo span { color: #3498db; }
        nav a { color: #555; text-decoration: none; margin-left: 24px; font-weight: 500; }
        nav a:hover, nav a.active { color: #3498db; }

        h1 { margin: 30px 0 20px; font-size: 24px; }
        h2 { margin: 24px 0 14px; font-size: 18px; }

        .card {
            background: #fff; border-radius: 10px; padding: 22px;
            border: 1px solid #e1e6eb; margin-bottom: 20px;
        }

        input, select {
            width: 100%; padding: 12px 14px;
            border: 1px solid #d5dbe0; border-radius: 8px;
            font-size: 15px; margin-bottom: 10px;
            font-family: inherit;
        }
        input:focus { outline: none; border-color: #3498db; }

        .btn {
            border: none; padding: 12px 20px; border-radius: 8px;
            cursor: pointer; font-weight: 600; font-size: 14px;
            transition: background .2s;
        }
        .btn-primary { background: #3498db; color: #fff; width: 100%; }
        .btn-primary:hover { background: #2980b9; }
        .btn-small { padding: 6px 12px; font-size: 13px; }
        .btn-small.btn-primary { width: auto; }
        .btn-danger { background: #fee2e2; color: #b91c1c; }
        .btn-danger:hover { background: #fecaca; }

        .error { color: #b91c1c; font-size: 14px; margin-top: 8px; }

        .admin-item {
            display: flex; justify-content: space-between;
            align-items: center; padding: 14px 0;
            border-bottom: 1px solid #f0f2f5;
            flex-wrap: wrap; gap: 10px;
        }
        .admin-item:last-child { border-bottom: none; }
        .admin-item strong { font-family: 'Courier New', monospace; }
        .admin-item .pays { color: #7f8c8d; font-size: 14px; }
        .admin-actions { display: flex; gap: 6px; }

        .empty {
            text-align: center; padding: 30px; color: #95a5a6;
            border: 1px dashed #d5dbe0; border-radius: 8px;
        }

        .toast {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1a252f; color: #fff;
            padding: 12px 22px; border-radius: 8px;
            font-weight: 600; opacity: 0;
            transition: all .3s; pointer-events: none;
            z-index: 999;
        }
        .toast.show {
            opacity: 1; transform: translateX(-50%) translateY(0);
        }

        .hint {
            background: #fff3cd; padding: 12px 16px;
            border-radius: 8px; border-left: 4px solid #ffc107;
            font-size: 13px; color: #856404; margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .admin-item { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-inner">
            <a href="index.html" class="logo">📱 iVASMS<span>Clone</span></a>
            <nav>
                <a href="index.html">Numéros</a>
                <a href="admin.html" class="active">⚙️ Admin</a>
            </nav>
        </div>
    </header>

    <main class="container">

        <!-- Login -->
        <section id="login-section">
            <h1>🔒 Administration</h1>
            <div class="card" style="max-width:400px">
                <form id="login-form">
                    <input type="password" id="pwd" placeholder="Mot de passe admin" required>
                    <button type="submit" class="btn btn-primary">Connexion</button>
                    <div id="login-error" class="error"></div>
                </form>
            </div>
        </section>

        <!-- Admin -->
        <section id="admin-section" style="display:none">
            <h1>⚙️ Panneau Admin</h1>

            <div class="hint">
                💡 Cet admin écrit directement dans Firebase. Pour de vrais SMS Twilio,
                connecte le webhook Twilio à une <strong>Firebase Function</strong> qui
                écrira dans <code>messages/{numeroId}</code>.
            </div>

            <h2>Ajouter un numéro</h2>
            <div class="card">
                <form id="add-form">
                    <input type="tel" id="input-numero" placeholder="+33612345678" required>
                    <input type="text" id="input-pays" placeholder="France" required>
                    <input type="text" id="input-operateur" placeholder="Orange / Twilio / SFR...">
                    <button type="submit" class="btn btn-primary">Ajouter</button>
                </form>
            </div>

            <h2>Numéros existants</h2>
            <div class="card">
                <div id="admin-list"><div class="empty">⏳ Chargement...</div></div>
            </div>
        </section>

    </main>

    <div id="toast" class="toast"></div>
</body>
</html>
