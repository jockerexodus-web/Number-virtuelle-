<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion - TCHATCHIBARA-WEB School</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <i class="fas fa-graduation-cap"></i>
                TCHATCHIBARA-WEB<span>School</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Accueil</a></li>
                <li><a href="inscription.html">Inscription</a></li>
            </ul>
        </nav>
    </header>

    <section class="auth-section">
        <div class="auth-card">
            <h2><i class="fas fa-sign-in-alt"></i> Connexion</h2>
            <p class="auth-sub">Accédez à vos cours</p>

            <form id="form-connexion">
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" name="email" placeholder="Adresse email" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="mot_de_passe" placeholder="Mot de passe" required>
                </div>
                <button type="submit" class="btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Se connecter
                </button>
            </form>

            <div id="msg" class="msg"></div>
            <p class="auth-link">Pas de compte ? <a href="inscription.html">S'inscrire</a></p>
        </div>
    </section>

    <script>
        document.getElementById('form-connexion').onsubmit = async (e) => {
            e.preventDefault();
            const form = e.target;
            const msg = document.getElementById('msg');
            msg.textContent = 'Connexion...';
            msg.className = 'msg info';

            const data = Object.fromEntries(new FormData(form));
            const res = await fetch('/api/auth/connexion', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const json = await res.json();

            if (res.ok) {
                msg.textContent = '✅ Connexion réussie, redirection...';
                msg.className = 'msg success';
                setTimeout(() => location.href = 'dashboard.html', 1000);
            } else {
                msg.textContent = '❌ ' + json.erreur;
                msg.className = 'msg error';
            }
        };
    </script>
</body>
</html>
