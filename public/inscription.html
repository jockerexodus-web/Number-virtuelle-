<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Inscription - TCHATCHIBARA-WEB School</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <i class="fas fa-graduation-cap"></i>
                TCHATCHIBARA-WEB<span>School</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Accueil</a></li>
                <li><a href="bac.html">Baccalauréat</a></li>
                <li><a href="exercices.html">Exercices</a></li>
                <li><a href="connexion.html" class="btn-connexion">Connexion</a></li>
            </ul>
        </nav>
    </header>

    <section class="auth-section">
        <div class="auth-card">
            <h2><i class="fas fa-user-plus"></i> Créer un compte</h2>
            <p class="auth-sub">Rejoignez TCHATCHIBARA-WEB School</p>

            <form id="form-inscription">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" name="nom" placeholder="Nom complet" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" name="email" placeholder="Adresse email" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="mot_de_passe" placeholder="Mot de passe (6+ caractères)" required minlength="6">
                </div>
                <div class="input-group">
                    <i class="fas fa-graduation-cap"></i>
                    <select name="classe" required>
                        <option value="">-- Choisir une classe --</option>
                        <optgroup label="Collège">
                            <option>6ème</option><option>5ème</option>
                            <option>4ème</option><option>3ème</option>
                        </optgroup>
                        <optgroup label="Lycée - 2nde">
                            <option>2nde A</option><option>2nde B</option>
                            <option>2nde C</option><option>2nde D</option><option>2nde E</option>
                        </optgroup>
                        <optgroup label="Lycée - 1ère">
                            <option>1ère A1</option><option>1ère A2</option>
                            <option>1ère B</option><option>1ère C</option>
                            <option>1ère D</option><option>1ère E</option>
                        </optgroup>
                        <optgroup label="Lycée - Terminale">
                            <option>Terminale A1</option><option>Terminale A2</option>
                            <option>Terminale B</option><option>Terminale C</option>
                            <option>Terminale D</option>
                        </optgroup>
                    </select>
                </div>
                <button type="submit" class="btn-primary">
                    <i class="fas fa-check"></i> S'inscrire
                </button>
            </form>

            <div id="msg" class="msg"></div>
            <p class="auth-link">Déjà un compte ? <a href="connexion.html">Se connecter</a></p>
        </div>
    </section>

    <script>
        document.getElementById('form-inscription').onsubmit = async (e) => {
            e.preventDefault();
            const form = e.target;
            const msg = document.getElementById('msg');
            msg.textContent = 'Envoi en cours...';
            msg.className = 'msg info';

            const data = Object.fromEntries(new FormData(form));
            const res = await fetch('/api/auth/inscription', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const json = await res.json();

            if (res.ok) {
                msg.textContent = '✅ ' + json.message;
                msg.className = 'msg success';
                form.reset();
            } else {
                msg.textContent = '❌ ' + json.erreur;
                msg.className = 'msg error';
            }
        };
    </script>
</body>
</html>
