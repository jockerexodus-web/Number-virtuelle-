<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Vérification email - TCHATCHIBARA-WEB School</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <i class="fas fa-graduation-cap"></i>
                TCHATCHIBARA-WEB<span>School</span>
            </div>
        </nav>
    </header>

    <section class="auth-section">
        <div class="auth-card" style="text-align:center">
            <h2><i class="fas fa-envelope-circle-check"></i> Vérification de l'email</h2>
            <div id="msg" class="msg info">Vérification en cours...</div>
            <p class="auth-link" style="margin-top:20px">
                <a href="connexion.html" class="btn-primary" style="display:inline-block;padding:10px 25px">Aller à la connexion</a>
            </p>
        </div>
    </section>

    <script>
        const params = new URLSearchParams(location.search);
        const token = params.get('token');
        const msg = document.getElementById('msg');

        if (!token) {
            msg.textContent = '❌ Token manquant.';
            msg.className = 'msg error';
        } else {
            fetch(`/api/auth/verifier?token=${token}`)
                .then(r => r.json())
                .then(data => {
                    if (data.message) {
                        msg.textContent = '✅ ' + data.message;
                        msg.className = 'msg success';
                    } else {
                        msg.textContent = '❌ ' + data.erreur;
                        msg.className = 'msg error';
                    }
                })
                .catch(() => {
                    msg.textContent = '❌ Erreur de connexion au serveur.';
                    msg.className = 'msg error';
                });
        }
    </script>
</body>
  </html>
