<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS — Toby SMS</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue, query, orderByChild, limitToLast, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        // ⚠️ MÊME config que index.html
        const firebaseConfig = {
            apiKey: "AIzaSyXXXXXXXXXXXXXXXXXXXXXXX",
            authDomain: "toby-sms.firebaseapp.com",
            databaseURL: "https://toby-sms-default-rtdb.firebaseio.com",
            projectId: "toby-sms",
            storageBucket: "toby-sms.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef123456"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const params = new URLSearchParams(location.search);
        const numeroId = params.get('id');

        if (!numeroId) location.href = 'index.html';

        const titleEl = document.getElementById('numero-titre');
        const subEl = document.getElementById('numero-sub');
        const container = document.getElementById('messages-container');

        let lastCount = 0;
        let firstLoad = true;

        // Infos du numéro
        onValue(ref(db, `numeros/${numeroId}`), (snap) => {
            const n = snap.val();
            if (!n) { location.href = 'index.html'; return; }
            titleEl.textContent = n.numero;
            subEl.innerHTML = `${escapeHtml(n.pays)} · ${escapeHtml(n.operateur || 'Twilio')} <span class="live-dot"></span><span class="live-text">En direct</span>`;
        });

        // Messages temps réel
        const messagesRef = query(
            ref(db, `messages/${numeroId}`),
            orderByChild('recu_at'),
            limitToLast(50)
        );

        onValue(messagesRef, (snapshot) => {
            const data = snapshot.val() || {};
            const messages = Object.entries(data)
                .map(([id, m]) => ({ id, ...m }))
                .sort((a, b) => (b.recu_at || 0) - (a.recu_at || 0));

            if (messages.length === 0) {
                container.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">📭</div>
                        <p>Aucun message pour le moment...</p>
                        <small>En attente de nouveaux SMS (temps réel)</small>
                    </div>`;
            } else {
                container.innerHTML = messages.map(m => {
                    const code = (m.contenu || '').match(/\b\d{4,8}\b/);
                    const codeBox = code ? `
                        <div class="code-box">
                            <span class="code-label">Code détecté :</span>
                            <span class="code-value">${code[0]}</span>
                            <button class="btn-copy" data-code="${code[0]}">Copier</button>
                        </div>` : '';

                    return `
                        <div class="message">
                            <div class="msg-header">
                                <strong>${escapeHtml(m.expediteur || 'Inconnu')}</strong>
                                <span class="time">${timeAgo(m.recu_at)}</span>
                            </div>
                            <div class="msg-body">${escapeHtml(m.contenu || '').replace(/\n/g, '<br>')}</div>
                            ${codeBox}
                        </div>`;
                }).join('');
                attachCopyHandlers();
            }

            if (!firstLoad && messages.length > lastCount) notifyNewMessage();
            lastCount = messages.length;
            firstLoad = false;
        });

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
            }[c]));
        }

        function timeAgo(ts) {
            if (!ts) return '—';
            const diff = Math.floor((Date.now() - ts) / 1000);
            if (diff < 60) return "à l'instant";
            if (diff < 3600) return Math.floor(diff / 60) + " min";
            if (diff < 86400) return Math.floor(diff / 3600) + " h";
            return Math.floor(diff / 86400) + " j";
        }

        function attachCopyHandlers() {
            document.querySelectorAll('.btn-copy').forEach(b => {
                b.addEventListener('click', async () => {
                    try {
                        await navigator.clipboard.writeText(b.dataset.code);
                        const old = b.textContent;
                        b.textContent = '✓ Copié !';
                        b.classList.add('copied');
                        setTimeout(() => {
                            b.textContent = old;
                            b.classList.remove('copied');
                        }, 1500);
                    } catch (e) {}
                });
            });
        }

        function notifyNewMessage() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.value = 800;
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                osc.start(); osc.stop(ctx.currentTime + 0.3);
            } catch (e) {}
        }

        document.getElementById('btn-vider').addEventListener('click', async () => {
            if (!confirm('Supprimer tous les messages de ce numéro ?')) return;
            await remove(ref(db, `messages/${numeroId}`));
        });
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f4f6f9; color: #2c3e50; line-height: 1.6; min-height: 100vh;
        }
        header {
            background: #fff; border-bottom: 1px solid #e1e6eb;
            position: sticky; top: 0; z-index: 100;
        }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
        .header-inner {
            display: flex; justify-content: space-between;
            align-items: center; height: 64px;
        }
        .logo {
            font-size: 20px; font-weight: 700; color: #2c3e50;
            text-decoration: none; display: flex; align-items: center; gap: 8px;
        }
        .logo .brand { color: #3498db; }
        .logo .studio {
            font-size: 11px; color: #95a5a6;
            font-weight: 500; letter-spacing: 0.5px;
            display: block; margin-top: -4px;
        }
        nav a { color: #555; text-decoration: none; margin-left: 24px; font-weight: 500; }
        nav a:hover, nav a.active { color: #3498db; }

        .back-link {
            display: inline-block; margin: 24px 0 16px;
            color: #3498db; text-decoration: none; font-weight: 500;
        }
        .back-link:hover { text-decoration: underline; }

        .sms-header {
            display: flex; justify-content: space-between;
            align-items: center; background: #fff; padding: 22px;
            border-radius: 10px; margin-bottom: 16px;
            border: 1px solid #e1e6eb; flex-wrap: wrap; gap: 12px;
        }
        .sms-header h1 {
            font-size: 22px; margin-bottom: 4px;
            font-family: 'Courier New', monospace;
        }
        .sms-header p { color: #7f8c8d; font-size: 14px; }

        .live-dot {
            display: inline-block; width: 8px; height: 8px;
            background: #2ecc71; border-radius: 50%;
            margin-left: 10px; vertical-align: middle;
            animation: pulse 1.5s infinite;
        }
        .live-text {
            color: #2ecc71; font-weight: 600;
            font-size: 12px; vertical-align: middle; margin-left: 4px;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(46,204,113,.7); }
            50% { opacity: .8; box-shadow: 0 0 0 6px rgba(46,204,113,0); }
        }

        .actions { display: flex; gap: 8px; }
        .btn {
            border: none; padding: 10px 16px; border-radius: 8px;
            cursor: pointer; font-weight: 600; font-size: 14px;
            transition: background .2s;
        }
        .btn-primary { background: #3498db; color: #fff; }
        .btn-primary:hover { background: #2980b9; }
        .btn-danger { background: #fee2e2; color: #b91c1c; }
        .btn-danger:hover { background: #fecaca; }

        .messages {
            display: flex; flex-direction: column; gap: 12px;
            margin-bottom: 50px;
        }
        .message {
            background: #fff; border-radius: 10px;
            padding: 16px 20px; border: 1px solid #e1e6eb;
            animation: slideIn .3s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg-header {
            display: flex; justify-content: space-between;
            margin-bottom: 8px; font-size: 14px;
        }
        .msg-header strong { color: #2980b9; }
        .msg-header .time { color: #95a5a6; font-size: 12px; }
        .msg-body {
            color: #2c3e50; font-size: 15px;
            word-break: break-word; margin-bottom: 8px;
        }

        .code-box {
            background: #f0fdf4; border: 1px solid #bbf7d0;
            border-radius: 8px; padding: 10px 14px;
            display: flex; align-items: center; gap: 10px;
            margin-top: 10px; flex-wrap: wrap;
        }
        .code-label { font-size: 13px; color: #166534; font-weight: 600; }
        .code-value {
            font-family: 'Courier New', monospace;
            font-size: 20px; font-weight: 700; color: #15803d;
            letter-spacing: 2px; background: #fff;
            padding: 4px 12px; border-radius: 6px;
            border: 1px solid #bbf7d0;
        }
        .btn-copy {
            margin-left: auto; background: #16a34a; color: #fff;
            border: none; padding: 6px 14px; border-radius: 6px;
            font-size: 13px; font-weight: 600;
            cursor: pointer; transition: background .2s;
        }
        .btn-copy:hover { background: #15803d; }
        .btn-copy.copied { background: #0ea5e9; }

        .empty {
            text-align: center; padding: 60px 40px; color: #95a5a6;
            background: #fff; border-radius: 10px;
            border: 1px dashed #d5dbe0;
        }
        .empty-icon { font-size: 42px; margin-bottom: 12px; }
        .empty p { font-size: 16px; margin-bottom: 6px; color: #7f8c8d; }
        .empty small { font-size: 13px; color: #b0b8bf; }

        footer {
            text-align: center; padding: 30px 0; color: #95a5a6;
            font-size: 14px; border-top: 1px solid #e1e6eb; background: #fff;
        }
        footer strong { color: #3498db; }

        @media (max-width: 600px) {
            .sms-header { flex-direction: column; align-items: flex-start; }
            .actions { width: 100%; }
            .actions .btn { flex: 1; }
            .logo { font-size: 17px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-inner">
            <a href="index.html" class="logo">
                <span>📱 <span class="brand">Toby SMS</span>
                <span class="studio">by Waze Studio</span></span>
            </a>
            <nav>
                <a href="index.html">Numéros</a>
                <a href="admin.html">⚙️ Admin</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <a href="index.html" class="back-link">← Retour aux numéros</a>

        <div class="sms-header">
            <div>
                <h1 id="numero-titre">...</h1>
                <p id="numero-sub">Chargement...</p>
            </div>
            <div class="actions">
                <button id="btn-vider" class="btn btn-danger">🗑 Vider</button>
            </div>
        </div>

        <div id="messages-container" class="messages">
            <div class="empty">⏳ Chargement...</div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; <span id="year"></span> <strong>Toby SMS</strong> by Waze Studio</p>
        </div>
    </footer>
    <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
