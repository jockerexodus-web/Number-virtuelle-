<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMS — Toby SMS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📱</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f4f6f9;--card:#fff;--text:#2c3e50;--muted:#7f8c8d;--border:#e1e6eb;--primary:#3498db;--primary-dark:#2980b9;--success:#2ecc71;--danger:#e74c3c}
body.dark{--bg:#0f1720;--card:#1a2530;--text:#e8edf2;--muted:#8b97a3;--border:#2a3643}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;transition:background .3s,color .3s}
.container{max-width:1000px;margin:0 auto;padding:0 20px}
header{background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.header-inner{display:flex;justify-content:space-between;align-items:center;height:68px;gap:16px;flex-wrap:wrap}
.logo{font-size:20px;font-weight:700;color:var(--text);text-decoration:none;display:flex;align-items:center;gap:8px}
.logo .brand{color:var(--primary)}
.logo .studio{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.5px;display:block;margin-top:-4px}
nav{display:flex;gap:4px}
nav a{color:var(--muted);text-decoration:none;padding:8px 14px;border-radius:8px;font-weight:500;font-size:14px}
nav a:hover{background:var(--bg);color:var(--text)}
.icon-btn{background:transparent;border:1px solid var(--border);color:var(--text);width:40px;height:40px;border-radius:10px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.icon-btn:hover{background:var(--bg);border-color:var(--primary);color:var(--primary)}
.back-link{display:inline-block;margin:24px 0 16px;color:var(--primary);text-decoration:none;font-weight:500}
.back-link:hover{text-decoration:underline}
.sms-header{display:flex;justify-content:space-between;align-items:center;background:var(--card);padding:22px;border-radius:12px;margin-bottom:16px;border:1px solid var(--border);flex-wrap:wrap;gap:12px}
.sms-header h1{font-size:22px;margin-bottom:4px;font-family:'Courier New',monospace}
.sms-header p{color:var(--muted);font-size:14px}
.live-dot{display:inline-block;width:8px;height:8px;background:var(--success);border-radius:50%;margin-left:10px;vertical-align:middle;animation:pulse 1.5s infinite}
.live-text{color:var(--success);font-weight:600;font-size:12px;vertical-align:middle;margin-left:4px}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(46,204,113,.7)}50%{opacity:.8;box-shadow:0 0 0 6px rgba(46,204,113,0)}}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:none;padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;transition:background .2s;font-family:inherit}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-danger{background:rgba(231,76,60,.12);color:var(--danger)}
.btn-danger:hover{background:rgba(231,76,60,.2)}
.messages{display:flex;flex-direction:column;gap:12px;margin-bottom:50px}
.message{background:var(--card);border-radius:12px;padding:16px 20px;border:1px solid var(--border);animation:slideIn .3s ease-out}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.msg-header{display:flex;justify-content:space-between;margin-bottom:8px;font-size:14px;gap:10px;flex-wrap:wrap}
.msg-header strong{color:var(--primary)}
.msg-header .time{color:var(--muted);font-size:12px}
.msg-body{color:var(--text);font-size:15px;word-break:break-word;margin-bottom:8px}
.code-box{background:rgba(46,204,113,.08);border:1px solid rgba(46,204,113,.3);border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.code-label{font-size:13px;color:#166534;font-weight:600}
body.dark .code-label{color:#4ade80}
.code-value{font-family:'Courier New',monospace;font-size:20px;font-weight:700;color:#15803d;letter-spacing:2px;background:var(--card);padding:4px 12px;border-radius:6px;border:1px solid rgba(46,204,113,.3)}
body.dark .code-value{color:#4ade80}
.btn-copy{margin-left:auto;background:#16a34a;color:#fff;border:none;padding:6px 14px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-copy:hover{background:#15803d}
.btn-copy.copied{background:#0ea5e9}
.empty{text-align:center;padding:60px 40px;color:var(--muted);background:var(--card);border-radius:12px;border:1px dashed var(--border)}
.empty-icon{font-size:48px;margin-bottom:14px;opacity:.7}
.empty p{font-size:16px;margin-bottom:6px;color:var(--text)}
.empty small{font-size:13px}
.loader{text-align:center;padding:60px 40px;background:var(--card);border-radius:12px;border:1px dashed var(--border)}
.loader-spin{width:44px;height:44px;border:4px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
footer{text-align:center;padding:30px 0;color:var(--muted);font-size:14px;border-top:1px solid var(--border);background:var(--card);margin-top:50px}
footer strong{color:var(--primary)}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:#1a252f;color:#fff;padding:12px 22px;border-radius:10px;font-weight:600;opacity:0;transition:all .3s;pointer-events:none;z-index:999;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:640px){
.sms-header{flex-direction:column;align-items:flex-start}
.actions{width:100%}
.actions .btn{flex:1}
.header-inner{height:auto;padding:12px 0;flex-direction:column;align-items:stretch}
nav{justify-content:center}
.logo{justify-content:center}
}
</style>
</head>
<body>
<header>
<div class="container header-inner">
<a href="index.html" class="logo"><span>📱 <span class="brand">Toby SMS</span><span class="studio">by Waze Studio</span></span></a>
<nav>
<a href="index.html">Numéros</a>
<a href="admin.html">⚙️ Admin</a>
</nav>
<button class="icon-btn" id="theme-toggle">🌙</button>
</div>
</header>

<main class="container">
<a href="index.html" class="back-link">← Retour aux numéros</a>

<div class="sms-header">
<div>
<h1 id="numero-titre">Chargement...</h1>
<p id="numero-sub">...</p>
</div>
<div class="actions">
<button id="btn-export" class="btn btn-primary">📥 Exporter</button>
<button id="btn-vider" class="btn btn-danger">🗑 Vider</button>
</div>
</div>

<div id="messages-container" class="messages">
<div class="loader"><div class="loader-spin"></div><p>Chargement des messages...</p></div>
</div>
</main>

<footer>
<div class="container">
<p>&copy; <span id="year"></span> <strong>Toby SMS</strong> by Waze Studio</p>
</div>
</footer>

<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyC7DyasG34K8ylgxbHVzxgAxIGACUFVbLA",
  authDomain: "toby-9065b.firebaseapp.com",
  databaseURL: "https://toby-9065b-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "toby-9065b",
  storageBucket: "toby-9065b.firebasestorage.app",
  messagingSenderId: "163849144101",
  appId: "1:163849144101:web:3db472e7f6f237afafbccc"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const params = new URLSearchParams(location.search);
const numeroId = params.get('id');
if (!numeroId) location.href = 'index.html';

const titleEl = document.getElementById('numero-titre');
const subEl = document.getElementById('numero-sub');
const container = document.getElementById('messages-container');

const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let allMessages = [];
let lastCount = 0;
let firstLoad = true;

onValue(ref(db, `numeros/${numeroId}`), (snap) => {
  const n = snap.val();
  if (!n) { location.href = 'index.html'; return; }
  titleEl.textContent = n.numero;
  subEl.innerHTML = `${esc(n.pays)} · ${esc(n.operateur||'Twilio')} <span class="live-dot"></span><span class="live-text">En direct</span>`;
});

onValue(ref(db, `messages/${numeroId}`), (snapshot) => {
  const data = snapshot.val() || {};
  allMessages = Object.entries(data).map(([id, m]) => ({ id, ...m }));
  allMessages.sort((a,b)=>(b.recu_at||0)-(a.recu_at||0));

  if (!firstLoad && allMessages.length > lastCount) notifyNewMessage();
  lastCount = allMessages.length;
  firstLoad = false;

  renderMessages();
});

function renderMessages() {
  if (!allMessages.length) {
    container.innerHTML = `<div class="empty"><div class="empty-icon">📭</div>
      <p>Aucun message pour le moment</p>
      <small>Les SMS reçus apparaîtront ici en temps réel</small>
      <small style="margin-top:12px;display:block;color:var(--primary)">💡 Va sur admin.html pour simuler un SMS</small></div>`;
    return;
  }

  container.innerHTML = allMessages.map(m => {
    const code = (m.contenu||'').match(/\b\d{4,8}\b/);
    const codeBox = code ? `<div class="code-box">
      <span class="code-label">Code détecté :</span>
      <span class="code-value">${code[0]}</span>
      <button class="btn-copy" data-code="${code[0]}">Copier</button>
    </div>` : '';
    return `<div class="message">
      <div class="msg-header">
        <strong>${esc(m.expediteur||'Inconnu')}</strong>
        <span class="time">${timeAgo(m.recu_at)}</span>
      </div>
      <div class="msg-body">${esc(m.contenu||'').replace(/\n/g,'<br>')}</div>
      ${codeBox}
    </div>`;
  }).join('');

  document.querySelectorAll('.btn-copy').forEach(b => {
    b.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(b.dataset.code);
        const old = b.textContent;
        b.textContent = '✓ Copié !';
        b.classList.add('copied');
        setTimeout(() => { b.textContent = old; b.classList.remove('copied'); }, 1500);
      } catch(e) {}
    });
  });
}

function timeAgo(ts) {
  if (!ts) return '—';
  const d = Math.floor((Date.now()-ts)/1000);
  if (d < 60) return "à l'instant";
  if (d < 3600) return Math.floor(d/60)+" min";
  if (d < 86400) return Math.floor(d/3600)+" h";
  return Math.floor(d/86400)+" j";
}

function notifyNewMessage() {
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 800;
    gain.gain.setValueAtTime(0.1, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
    osc.start(); osc.stop(ctx.currentTime + 0.3);
  } catch(e) {}
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

document.getElementById('btn-vider').addEventListener('click', async () => {
  if (!confirm('Supprimer tous les messages ?')) return;
  await remove(ref(db, `messages/${numeroId}`));
  showToast('✅ Messages supprimés');
});

document.getElementById('btn-export').addEventListener('click', () => {
  if (!allMessages.length) { showToast('Aucun message'); return; }
  const txt = allMessages.map(m =>
    `[${new Date(m.recu_at||Date.now()).toLocaleString('fr-FR')}] ${m.expediteur}\n${m.contenu}\n`
  ).join('\n---\n\n');
  const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `toby-sms-${numeroId}.txt`;
  a.click();
  showToast('📥 Export téléchargé');
});

const themeToggle = document.getElementById('theme-toggle');
const savedTheme = localStorage.getItem('toby_theme') || 'light';
document.body.classList.toggle('dark', savedTheme === 'dark');
themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';
themeToggle.addEventListener('click', () => {
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  themeToggle.textContent = isDark ? '☀️' : '🌙';
  localStorage.setItem('toby_theme', isDark ? 'dark' : 'light');
});
document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
